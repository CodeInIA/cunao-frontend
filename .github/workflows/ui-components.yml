name: UI Components Tests

on:
  push:
    paths:
      - 'src/components/**/*.tsx'
      - 'src/__tests__/components/**'
      - '.github/workflows/ui-components.yml'
  pull_request:
    paths:
      - 'src/components/**/*.tsx'
      - 'src/__tests__/components/**'
  workflow_dispatch:

env:
  VITE_API_URL: 'http://localhost:3000'
  VITE_STRIPE_PUBLIC_KEY: 'pk_test_fake_key_for_workflow_compilation_only'

jobs:
  test-components:
    name: Test UI Components
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run component tests
        run: npm test -- src/__tests__/components
        continue-on-error: true
      
      - name: Test Header component
        run: npm test -- src/components/Header.test.tsx
        continue-on-error: true
      
      - name: Test Footer component
        run: npm test -- src/components/Footer.test.tsx
        continue-on-error: true
      
      - name: Type check all components
        run: npx tsc --noEmit src/components/**/*.tsx
      
      - name: Lint all components
        run: npx eslint src/components/**/*.tsx
        continue-on-error: true
      
      - name: Check component prop types
        run: npx tsc --noEmit --strict src/components/**/*.tsx
        continue-on-error: true
