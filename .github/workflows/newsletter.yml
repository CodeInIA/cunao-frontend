name: Newsletter Feature Tests

on:
  push:
    paths:
      - 'src/components/NewsletterModal.tsx'
      - 'src/components/NewsletterForm.tsx'
      - 'src/services/newsletterService.ts'
      - 'src/__tests__/newsletter/**'
      - '.github/workflows/newsletter.yml'
  pull_request:
    paths:
      - 'src/components/NewsletterModal.tsx'
      - 'src/components/NewsletterForm.tsx'
      - 'src/services/newsletterService.ts'
      - 'src/__tests__/newsletter/**'
  workflow_dispatch:

env:
  VITE_API_URL: 'http://localhost:3000'
  VITE_STRIPE_PUBLIC_KEY: 'pk_test_fake_key_for_workflow_compilation_only'

jobs:
  test-newsletter:
    name: Test Newsletter Feature
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run newsletter tests
        run: npm test -- src/__tests__/newsletter
        continue-on-error: true
      
      - name: Type check newsletter
        run: npx tsc --noEmit src/components/NewsletterModal.tsx src/components/NewsletterForm.tsx src/services/newsletterService.ts
      
      - name: Lint newsletter code
        run: npx eslint src/components/NewsletterModal.tsx src/components/NewsletterForm.tsx src/services/newsletterService.ts
        continue-on-error: true
