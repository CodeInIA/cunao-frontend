name: Admin Panel Tests

on:
  push:
    paths:
      - 'src/pages/AdminPage.tsx'
      - 'src/components/AdminDashboard.tsx'
      - 'src/components/AdminLogin.tsx'
      - 'src/services/adminService.ts'
      - 'src/stores/adminStore.ts'
      - 'src/__tests__/admin/**'
      - '.github/workflows/admin.yml'
  pull_request:
    paths:
      - 'src/pages/AdminPage.tsx'
      - 'src/components/AdminDashboard.tsx'
      - 'src/components/AdminLogin.tsx'
      - 'src/services/adminService.ts'
      - 'src/stores/adminStore.ts'
      - 'src/__tests__/admin/**'
  workflow_dispatch:

env:
  VITE_API_URL: 'http://localhost:3000'
  VITE_STRIPE_PUBLIC_KEY: 'pk_test_fake_key_for_workflow_compilation_only'

jobs:
  test-admin:
    name: Test Admin Panel
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run admin tests
        run: npm test -- src/__tests__/admin
        continue-on-error: true
      
      - name: Test admin authentication
        run: npm test -- src/services/adminApi.test.ts
        continue-on-error: true
      
      - name: Type check admin
        run: npx tsc --project tsconfig.app.json --noEmit
        continue-on-error: true
      
      - name: Lint admin code
        run: npx eslint src/services/adminApi.ts
        continue-on-error: true
      
      - name: Security check - no hardcoded credentials
        run: |
          if grep -r "password.*=.*['\"]" src/pages/AdminPage.tsx src/components/AdminLogin.tsx src/services/adminService.ts; then
            echo "Warning: Potential hardcoded credentials found"
            exit 1
          fi
        continue-on-error: true
