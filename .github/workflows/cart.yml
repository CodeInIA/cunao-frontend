name: Shopping Cart Tests

on:
  push:
    paths:
      - 'src/pages/CartPage.tsx'
      - 'src/components/Cart.tsx'
      - 'src/components/CartItem.tsx'
      - 'src/stores/cartStore.ts'
      - 'src/__tests__/cart/**'
      - '.github/workflows/cart.yml'
  pull_request:
    paths:
      - 'src/pages/CartPage.tsx'
      - 'src/components/Cart.tsx'
      - 'src/components/CartItem.tsx'
      - 'src/stores/cartStore.ts'
      - 'src/__tests__/cart/**'
  workflow_dispatch:

env:
  VITE_API_URL: 'http://localhost:3000'
  VITE_STRIPE_PUBLIC_KEY: 'pk_test_fake_key_for_workflow_compilation_only'

jobs:
  test-cart:
    name: Test Shopping Cart
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run cart tests
        run: npm test -- src/__tests__/cart
        continue-on-error: true
      
      - name: Test cart store
        run: npm test -- src/stores/cartStore.test.ts
        continue-on-error: true
      
      - name: Type check cart components
        run: npx tsc --noEmit src/pages/CartPage.tsx src/components/Cart.tsx src/components/CartItem.tsx src/stores/cartStore.ts
      
      - name: Lint cart code
        run: npx eslint src/pages/CartPage.tsx src/components/Cart.tsx src/components/CartItem.tsx src/stores/cartStore.ts
        continue-on-error: true
