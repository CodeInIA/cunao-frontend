name: Accessibility Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  VITE_API_URL: 'http://localhost:3000'
  VITE_STRIPE_PUBLIC_KEY: 'pk_test_fake_key_for_workflow_compilation_only'

jobs:
  a11y-tests:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install axe-core
        run: npm install --save-dev @axe-core/react axe-core
      
      - name: Run accessibility tests
        run: npm test -- src/__tests__/a11y
        continue-on-error: true
      
      - name: Build for a11y testing
        run: npm run build
      
      - name: Check ARIA attributes
        run: |
          echo "Checking for proper ARIA usage..."
          grep -r "aria-" src/components src/pages || echo "No ARIA attributes found - consider adding them for better accessibility"
        continue-on-error: true
      
      - name: Check semantic HTML
        run: |
          echo "Checking for semantic HTML elements..."
          grep -r "<main\|<nav\|<header\|<footer\|<article\|<section" src/components src/pages || echo "Limited semantic HTML found"
        continue-on-error: true
      
      - name: Check alt text on images
        run: |
          echo "Checking for images without alt text..."
          if grep -r "<img" src/ | grep -v "alt="; then
            echo "❌ Found images without alt text"
            exit 1
          else
            echo "✅ All images have alt text"
          fi
        continue-on-error: true
      
      - name: Check form labels
        run: |
          echo "Checking for form inputs with labels..."
          grep -r "<input\|<textarea\|<select" src/components src/pages || echo "No form elements found"
        continue-on-error: true

  keyboard-navigation:
    name: Keyboard Navigation Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run keyboard navigation tests
        run: npm test -- src/__tests__/keyboard-navigation
        continue-on-error: true
      
      - name: Check for keyboard traps
        run: |
          echo "Checking for potential keyboard traps..."
          grep -r "tabIndex.*-1" src/ && echo "⚠️ Found tabIndex=-1, verify it's not creating keyboard traps" || echo "✅ No obvious keyboard traps"
        continue-on-error: true
      
      - name: Check focus management
        run: |
          echo "Checking for focus management..."
          grep -r "\.focus()\|autoFocus" src/ || echo "No explicit focus management found"
        continue-on-error: true
