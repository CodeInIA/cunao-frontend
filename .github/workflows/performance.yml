name: Performance Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Mondays at 2 AM

env:
  VITE_API_URL: 'http://localhost:3000'
  VITE_STRIPE_PUBLIC_KEY: 'pk_test_fake_key_for_workflow_compilation_only'

jobs:
  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build production bundle
        run: npm run build
      
      - name: Analyze bundle size
        run: |
          echo "=== Total Bundle Size ==="
          du -sh dist/
          echo ""
          echo "=== Bundle Breakdown ==="
          du -h dist/assets/* | sort -rh | head -20
          echo ""
          echo "=== JavaScript Files ==="
          find dist -name "*.js" -exec du -h {} + | sort -rh
          echo ""
          echo "=== CSS Files ==="
          find dist -name "*.css" -exec du -h {} + | sort -rh
      
      - name: Check bundle size limits
        run: |
          TOTAL_SIZE=$(du -sb dist/ | cut -f1)
          MAX_SIZE=$((5 * 1024 * 1024))  # 5MB limit
          if [ $TOTAL_SIZE -gt $MAX_SIZE ]; then
            echo "❌ Bundle size ($TOTAL_SIZE bytes) exceeds limit ($MAX_SIZE bytes)"
            exit 1
          else
            echo "✅ Bundle size ($TOTAL_SIZE bytes) is within limits"
          fi
        continue-on-error: true
      
      - name: Check for large dependencies
        run: |
          echo "=== Largest Dependencies ==="
          du -h node_modules/* | sort -rh | head -20
        continue-on-error: true

  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build production
        run: npm run build
      
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x
      
      - name: Run Lighthouse CI
        run: |
          npx lhci autorun --collect.staticDistDir=./dist || echo "Lighthouse audit completed with warnings"
        continue-on-error: true

  render-performance:
    name: Component Render Performance
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run performance tests
        run: npm test -- src/__tests__/performance
        continue-on-error: true
