name: Code Quality Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  VITE_API_URL: 'http://localhost:3000'
  VITE_STRIPE_PUBLIC_KEY: 'pk_test_fake_key_for_workflow_compilation_only'

jobs:
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint (strict)
        run: npx eslint . --ext .ts,.tsx --max-warnings 0
        continue-on-error: true
      
      - name: Run TypeScript compiler (strict)
        run: npx tsc --project tsconfig.app.json --noEmit --strict
        continue-on-error: true
      
      - name: Check for console logs
        run: |
          echo "Checking for console statements..."
          if grep -r "console\." src/ --exclude-dir=test --exclude-dir=__tests__ | grep -v "console.error"; then
            echo "⚠️ Found console statements in source code"
            exit 1
          else
            echo "✅ No console statements found"
          fi
        continue-on-error: true
      
      - name: Check for TODO comments
        run: |
          echo "Checking for TODO comments..."
          grep -r "TODO\|FIXME\|HACK" src/ || echo "No TODO comments found"
        continue-on-error: true
      
      - name: Check for unused exports
        run: npx ts-prune || echo "Unused exports check completed"
        continue-on-error: true
      
      - name: Check code complexity
        run: |
          echo "Analyzing code complexity..."
          npx eslint . --ext .ts,.tsx --rule 'complexity: ["error", 10]'
        continue-on-error: true
      
      - name: Check file sizes
        run: |
          echo "Checking for large files (>500 lines)..."
          find src -name "*.ts" -o -name "*.tsx" | while read file; do
            lines=$(wc -l < "$file")
            if [ $lines -gt 500 ]; then
              echo "⚠️ $file has $lines lines (consider splitting)"
            fi
          done
        continue-on-error: true

  duplicate-code:
    name: Duplicate Code Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install jscpd
        run: npm install -g jscpd
      
      - name: Run duplicate code detection
        run: npx jscpd src/ || echo "Duplicate code check completed"
        continue-on-error: true

  dependency-analysis:
    name: Dependency Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check for unused dependencies
        run: npx depcheck
        continue-on-error: true
      
      - name: Analyze bundle impact
        run: |
          echo "Checking dependency sizes..."
          npm list --depth=0 --json | grep -o '"[^"]*": "[0-9]' || echo "Dependency analysis completed"
        continue-on-error: true
