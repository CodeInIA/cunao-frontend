name: Routing Tests

on:
  push:
    paths:
      - 'src/App.tsx'
      - 'src/pages/**'
      - 'src/__tests__/routing/**'
      - '.github/workflows/routing.yml'
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'src/pages/**'
      - 'src/__tests__/routing/**'
  workflow_dispatch:

env:
  VITE_API_URL: 'http://localhost:3000'
  VITE_STRIPE_PUBLIC_KEY: 'pk_test_fake_key_for_workflow_compilation_only'

jobs:
  test-routing:
    name: Test React Router Configuration
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run routing tests
        run: npm test -- src/__tests__/routing
        continue-on-error: true
      
      - name: Test navigation flow
        run: npm test -- src/__tests__/integration/navigation.test.tsx
        continue-on-error: true
      
      - name: Type check routing
        run: npx tsc --project tsconfig.app.json --noEmit
        continue-on-error: true
      
      - name: Lint routing code
        run: npx eslint src/App.tsx
        continue-on-error: true
      
      - name: Validate all routes exist
        run: |
          echo "Checking if all route pages exist..."
          test -f src/pages/HomePage.tsx
          test -f src/pages/ProductsPage.tsx
          test -f src/pages/ProductDetailPage.tsx
          test -f src/pages/CheckoutPage.tsx
          test -f src/pages/ReviewPage.tsx
          test -f src/pages/ContactPage.tsx
          test -f src/pages/AboutPage.tsx
          test -f src/pages/SuccessPage.tsx
          echo "All route pages exist!"
