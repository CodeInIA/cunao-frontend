name: Full Test Suite - Frontend

on:
  schedule:
    - cron: '0 3 * * 0'  # Domingos a las 3 AM
  workflow_dispatch:  # Permite ejecución manual

jobs:
  full-suite:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint (strict)
        run: npm run lint
        continue-on-error: true
      
      - name: TypeScript compilation check
        run: npx tsc --noEmit
      
      - name: Run all tests with coverage
        run: npm test -- --coverage || echo "Tests not configured yet"
        continue-on-error: true
        env:
          VITE_API_URL: 'http://localhost:3000'
          VITE_STRIPE_PUBLIC_KEY: 'pk_test_fake_key_for_workflow_compilation_only'
      
      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: 'http://localhost:3000'
          VITE_STRIPE_PUBLIC_KEY: 'pk_test_fake_key_for_workflow_compilation_only'
      
      - name: Analyze bundle size
        run: |
          echo "📦 Bundle Analysis:"
          echo "=================="
          du -sh dist/
          echo ""
          echo "📊 Detailed breakdown:"
          du -h dist/assets/* | sort -rh | head -20
      
      - name: Check for unused dependencies
        run: npx depcheck || echo "Depcheck completed"
        continue-on-error: true
