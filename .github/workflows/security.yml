name: Security Audit - Frontend

on:
  schedule:
    - cron: '0 2 * * *'  # Diariamente a las 2 AM
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate || echo "Vulnerabilities found, review required"
        continue-on-error: true
      
      - name: Check for outdated packages
        run: npx npm-check-updates || echo "Package updates available"
        continue-on-error: true
      
      - name: Validate package-lock.json
        run: npm ls || echo "Dependency tree validated"
        continue-on-error: true
