name: Deployment Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  VITE_API_URL: 'http://localhost:3000'
  VITE_STRIPE_PUBLIC_KEY: 'pk_test_fake_key_for_workflow_compilation_only'

jobs:
  build-validation:
    name: Validate Production Build
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build for production
        run: npm run build
      
      - name: Verify build output
        run: |
          echo "Checking build artifacts..."
          test -d dist
          test -f dist/index.html
          echo "✅ Build artifacts verified"
      
      - name: Check HTML file
        run: |
          echo "Validating index.html..."
          grep -q "<script" dist/index.html
          grep -q "type=\"module\"" dist/index.html
          echo "✅ HTML file valid"
      
      - name: Check for source maps
        run: |
          echo "Checking for source maps..."
          find dist -name "*.map" | head -5
        continue-on-error: true
      
      - name: Validate asset paths
        run: |
          echo "Checking asset references..."
          grep -r "assets/" dist/index.html || echo "No asset references found in HTML"

  preview-deploy:
    name: Preview Deployment Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build for preview
        run: npm run build
      
      - name: Test production build locally
        run: npx vite preview --port 4173 &
      
      - name: Wait for server
        run: sleep 5
      
      - name: Check server response
        run: |
          curl -I http://localhost:4173 || echo "Preview server check completed"
        continue-on-error: true

  env-check:
    name: Environment Variables Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for hardcoded URLs
        run: |
          echo "Checking for hardcoded production URLs..."
          if grep -r "http://localhost" src/ --exclude-dir=test --exclude-dir=__tests__ | grep -v "VITE_"; then
            echo "⚠️ Found hardcoded localhost URLs - use environment variables instead"
          else
            echo "✅ No hardcoded URLs found"
          fi
        continue-on-error: true
      
      - name: Check for exposed secrets
        run: |
          echo "Checking for potential secrets..."
          if grep -r "sk_\|pk_live\|password.*=.*['\"]" src/; then
            echo "❌ Potential secrets found in source code!"
            exit 1
          else
            echo "✅ No exposed secrets found"
          fi
      
      - name: Validate environment variable usage
        run: |
          echo "Checking environment variable usage..."
          grep -r "import\.meta\.env\." src/ || echo "No environment variables used"
        continue-on-error: true

  size-report:
    name: Build Size Report
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build production
        run: npm run build
      
      - name: Generate size report
        run: |
          echo "# 📊 Build Size Report" > size-report.md
          echo "" >> size-report.md
          echo "## Total Size" >> size-report.md
          du -sh dist/ >> size-report.md
          echo "" >> size-report.md
          echo "## Asset Breakdown" >> size-report.md
          du -h dist/assets/* | sort -rh | head -20 >> size-report.md
          echo "" >> size-report.md
          echo "## File Count" >> size-report.md
          echo "JavaScript files: $(find dist -name '*.js' | wc -l)" >> size-report.md
          echo "CSS files: $(find dist -name '*.css' | wc -l)" >> size-report.md
          echo "Image files: $(find dist -name '*.png' -o -name '*.jpg' -o -name '*.webp' | wc -l)" >> size-report.md
          cat size-report.md
      
      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: build-size-report
          path: size-report.md
        continue-on-error: true
