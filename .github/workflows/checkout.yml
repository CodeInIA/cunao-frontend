name: Checkout & Payment Tests

on:
  push:
    paths:
      - 'src/pages/CheckoutPage.tsx'
      - 'src/components/CheckoutForm.tsx'
      - 'src/components/PaymentForm.tsx'
      - 'src/services/stripeService.ts'
      - 'src/__tests__/checkout/**'
      - '.github/workflows/checkout.yml'
  pull_request:
    paths:
      - 'src/pages/CheckoutPage.tsx'
      - 'src/components/CheckoutForm.tsx'
      - 'src/components/PaymentForm.tsx'
      - 'src/services/stripeService.ts'
      - 'src/__tests__/checkout/**'
  workflow_dispatch:

env:
  VITE_API_URL: 'http://localhost:3000'
  VITE_STRIPE_PUBLIC_KEY: 'pk_test_fake_key_for_workflow_compilation_only'

jobs:
  test-checkout:
    name: Test Checkout & Stripe Integration
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run checkout tests
        run: npm test -- src/__tests__/checkout
        continue-on-error: true
      
      - name: Test Stripe integration
        run: npm test -- src/services/stripeService.test.ts
        continue-on-error: true
      
      - name: Type check checkout
        run: npx tsc --noEmit src/pages/CheckoutPage.tsx src/components/CheckoutForm.tsx src/components/PaymentForm.tsx src/services/stripeService.ts
      
      - name: Lint checkout code
        run: npx eslint src/pages/CheckoutPage.tsx src/components/CheckoutForm.tsx src/components/PaymentForm.tsx src/services/stripeService.ts
        continue-on-error: true
      
      - name: Validate Stripe SDK usage
        run: npx eslint --rule '@typescript-eslint/no-floating-promises:error' src/services/stripeService.ts
        continue-on-error: true
